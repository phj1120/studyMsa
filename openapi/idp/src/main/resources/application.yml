spring:
  profiles:
    default: local
  application:
    name: idp
  datasource:
    url: jdbc:mysql://localhost:3306/openapi_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: openapi
    password: openapi123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 9002

openapi:
  jwt:
    issuer: http://localhost:9002
    key-id: api-key-v1
    expiration-seconds: 3600
    private-key-base64: 
    public-key-base64: 

logging:
  level:
    org.example.openapi: DEBUG
