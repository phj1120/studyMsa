spring.application.name=encryptModule

# Crypto (AES-256-GCM) - Base64 encoded 32-byte key (운영 환경에서는 환경변수로 교체)
crypto.secret-key=dGhpcy1pcy1hLXNhbXBsZS0zMi1ieXRlLXNlY3JldCE=

# MySQL Database (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/appdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=appuser
spring.datasource.password=apppass

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL Query Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Binding Parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE